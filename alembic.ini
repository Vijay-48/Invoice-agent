# Database migrations (Alembic). The database address comes from DATABASE_URL (app/config.py), not
# from this file. The app upgrades itself on start (app/migrate.py); by hand:
#   alembic upgrade head                              apply every migration
#   alembic revision --autogenerate -m "what changed" after changing app/models.py; read the result
#   alembic check                                     fails if app/models.py and the migrations differ
[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
